<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Dr. Rafael Rocha — Ortopedia e Traumatologia</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Dr. Rafael Rocha — Ortopedia e Traumatologia em Águas Claras, Brasília-DF." />
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d1b1e;
    --card-bg: #f4f2ec;
    --ink: #f4f2ec;
    --ink-dim: #b7c4c2;
    --accent-teal-dark: #0f3340;
    --accent-teal-light: #5bb5d0;
    --accent-whatsapp-dark: #075e54;
    --accent-whatsapp-light: #25d366;
  }

  * { box-sizing: border-box; }

  @font-face {
    font-family: 'Satoshi-fallback';
    src: local('Helvetica Neue'), local('Arial');
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 120% at 20% 0%, #16292c 0%, var(--bg) 55%, #081113 100%);
    font-family: 'Satoshi-fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: clamp(20px, 6vw, 48px) clamp(14px, 4vw, 20px);
  }

  .phone {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 22px;
  }

  .brand .logo-frame {
    width: clamp(72px, 20vw, 92px);
    height: clamp(72px, 20vw, 92px);
    border-radius: 22%;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.6);
    overflow: hidden;
    flex-shrink: 0;
  }

  .brand .logo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 15%;
    display: block;
  }

  .brand .tagline {
    margin-top: clamp(10px, 3vw, 14px);
    text-align: center;
    color: var(--ink);
    font-size: clamp(14px, 4vw, 16px);
    font-weight: 600;
    line-height: 1.4;
    max-width: 320px;
    text-wrap: balance;
  }

  .brand .subtag {
    margin-top: 4px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 12px;
    letter-spacing: 0.04em;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: clamp(96px, 29vw, 128px) clamp(96px, 29vw, 128px) auto;
    gap: clamp(8px, 2.6vw, 12px);
  }

  .card {
    border-radius: clamp(14px, 4vw, 20px);
    position: relative;
    overflow: hidden;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(10px, 3.2vw, 14px);
    text-decoration: none;
    box-shadow: 0 8px 24px -12px rgba(0,0,0,0.55);
    transition: transform 0.18s ease;
  }

  .card:active { transform: scale(0.98); }

  .card .icon {
    position: relative;
    z-index: 1;
    width: clamp(18px, 5.5vw, 22px);
    height: clamp(18px, 5.5vw, 22px);
    opacity: 0.95;
    margin-bottom: clamp(4px, 1.6vw, 7px);
  }

  .card .label {
    position: relative;
    z-index: 1;
    font-weight: 600;
    line-height: 1.22;
    font-size: clamp(12.5px, 3.6vw, 14.5px);
    text-wrap: balance;
  }

  /* photo card — spans all 3 rows */
  .photo {
    grid-column: 1 / 2;
    grid-row: 1 / 4;
    padding: 0;
    justify-content: flex-end;
  }

  .photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 18%;
  }

  .photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.75) 100%);
  }

  .photo .who {
    position: relative;
    z-index: 1;
    padding: 12px;
    min-width: 0;
  }

  .photo .handle {
    font-weight: 700;
    font-size: clamp(11.5px, 3.4vw, 13px);
    overflow-wrap: anywhere;
    word-break: break-word;
    line-height: 1.25;
  }

  .photo .role {
    font-size: clamp(10px, 2.8vw, 11px);
    color: var(--ink-dim);
    margin-top: 3px;
  }

  /* maps-wrap: caption above + big bookmark-style card with live mini map */
  .maps-wrap {
    grid-column: 2 / 4;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .maps {
    flex: 1;
    padding: 0;
    justify-content: flex-end;
    background: #1b2a2c;
  }

  .maps .map-embed {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 132%;
    border: 0;
    pointer-events: none;
  }

  .maps::after {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 46%;
    background: linear-gradient(180deg, rgba(13,27,30,0) 0%, rgba(13,27,30,0.92) 100%);
    pointer-events: none;
  }

  .maps .body {
    position: relative;
    z-index: 1;
    padding: clamp(10px, 3.2vw, 14px);
  }

  .maps .label {
    font-size: clamp(14.5px, 4.6vw, 18px);
  }

  /* small square cards — site & whatsapp, same size */
  .site {
    grid-column: 2 / 3;
    grid-row: 3 / 4;
    background: linear-gradient(155deg, var(--accent-teal-dark) 0%, var(--accent-teal-light) 150%);
    align-items: center;
    text-align: center;
    justify-content: center;
    min-height: clamp(76px, 22vw, 100px);
  }

  .whatsapp {
    grid-column: 3 / 4;
    grid-row: 3 / 4;
    background: linear-gradient(155deg, var(--accent-whatsapp-dark) 0%, var(--accent-whatsapp-light) 140%);
    align-items: center;
    text-align: center;
    justify-content: center;
    min-height: clamp(76px, 22vw, 100px);
  }

  .maps .icon, .site .icon, .whatsapp .icon { margin: 0 auto clamp(4px, 1.6vw, 7px); }
  .site .label, .whatsapp .label { font-size: clamp(12px, 3.4vw, 13.5px); }

  .note {
    margin-top: 22px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 12px;
    line-height: 1.5;
  }

  .note a { color: var(--ink); }

  @media (min-width: 680px) {
    body { padding: 3vh 4vw; }
    .phone { max-width: min(920px, 90vw); }
    .brand { margin-bottom: min(34px, 3vh); }
    .brand .logo-frame {
      width: min(110px, 10vh);
      height: min(110px, 10vh);
      border-radius: 24px;
    }
    .brand .tagline {
      margin-top: min(16px, 1.6vh);
      font-size: min(20px, 2.2vh);
      max-width: 480px;
    }
    .grid {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: min(190px, 18vh) min(190px, 18vh) auto;
      gap: min(18px, 1.8vh);
    }
    .card {
      border-radius: min(26px, 2.4vh);
      padding: min(24px, 2.2vh);
    }
    .card .icon {
      width: min(26px, 2.4vh);
      height: min(26px, 2.4vh);
      margin-bottom: min(10px, 1vh);
    }
    .card .label {
      font-size: min(19px, 1.9vh);
      line-height: 1.25;
    }
    .photo .handle { font-size: min(16px, 1.6vh); }
    .photo .role { font-size: min(13px, 1.3vh); margin-top: 4px; }
    .photo .who { padding: min(20px, 2vh); }
    .maps .label { font-size: min(23px, 2.3vh); }
    .site .label, .whatsapp .label { font-size: min(17px, 1.7vh); }
    .site .icon, .whatsapp .icon { width: min(26px, 2.4vh); height: min(26px, 2.4vh); margin: 0 auto min(8px, 0.9vh); }
  }
</style>
</head>
